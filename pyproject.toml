[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fplan"
description = "Factorio production and placement planner"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Henru Wang" }]
keywords = ["factorio", "optimization", "planning"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
# Version is single-sourced from src/fplan/_version.py (see [tool.hatch.version]).
dynamic = ["version"]
# Typer is a core dependency, not an optional extra: the CLI is the project's
# primary human interface.
dependencies = ["typer>=0.12,<1.0"]

[project.scripts]
fplan = "fplan.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.15",
    "mypy>=1.13",
    "pre-commit>=4",
    "detect-secrets>=1.5",
    "build>=1.2",
    "twine>=5",
]

[project.urls]
Homepage = "https://github.com/jiggloo/fplan"
Source = "https://github.com/jiggloo/fplan"
Issues = "https://github.com/jiggloo/fplan/issues"

# Single source of truth for the version: the __version__ literal in this file.
[tool.hatch.version]
path = "src/fplan/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fplan"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=fplan --cov-report=term-missing"

[tool.coverage.run]
source = ["fplan"]

[tool.coverage.report]
fail_under = 80
show_missing = true
