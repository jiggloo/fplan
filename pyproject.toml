[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fplan"
description = "Factorio production and placement planner"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Henru Wang" }]
keywords = ["factorio", "optimization", "planning"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
# Version is single-sourced from src/fplan/_version.py (see [tool.hatch.version]).
dynamic = ["version"]
# Typer is a core dependency, not an optional extra: the CLI is the project's
# primary human interface.
dependencies = [
    "typer>=0.12,<1.0",
    "pyyaml>=6",
    "numpy>=1.26",
    "lupa>=2.0",
    "toposort>=1.10",
    "pyscipopt>=5.2",
]

[project.scripts]
fplan = "fplan.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.15",
    "mypy>=1.13",
    "pre-commit>=4",
    "detect-secrets>=1.5",
    "build>=1.2",
    "twine>=5",
    "types-PyYAML>=6",
]

[project.urls]
Homepage = "https://github.com/jiggloo/fplan"
Source = "https://github.com/jiggloo/fplan"
Issues = "https://github.com/jiggloo/fplan/issues"

# Single source of truth for the version: the __version__ literal in this file.
[tool.hatch.version]
path = "src/fplan/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fplan"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# l2/viz.py embeds a large self-contained HTML/CSS/JS asset as string literals
# (the interactive timeline template + heatmap styles). Line length is
# meaningless inside minified-ish CSS/JS, and E501 can't be suppressed per-line
# inside a triple-quoted string. The module's actual Python stays formatted.
[tool.ruff.lint.per-file-ignores]
"src/fplan/l2/viz.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
no_implicit_optional = true

# lupa (LuaJIT bindings), toposort, and pyscipopt ship no type stubs.
[[tool.mypy.overrides]]
module = ["lupa", "toposort", "pyscipopt"]
ignore_missing_imports = true

# l2.solve is the SCIP layer: ~2400 lines built against pyscipopt's untyped
# Var objects (every model variable is effectively `Any`, so arithmetic on them
# can't be meaningfully checked). Like its coverage omission, it's verified by
# the manual integration test, not the type checker. The solver-NEUTRAL L2
# modules (config, scenario, instance, deployment, pseudo_recipes) ARE checked.
[[tool.mypy.overrides]]
module = ["fplan.l2.solve"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=fplan --cov-report=term-missing"

[tool.coverage.run]
source = ["fplan"]
# Entry points that need a real Factorio install (no game data in CI) are
# exercised manually — see the README Testing section. l2/solve.py is the SCIP
# layer: it needs the full game model and a (slow, primal-coin-flip) solve, so
# it's exercised by the manual integration test, not CI — like the headless map
# extract and the Lua model load.
omit = ["*/__main__.py", "*/l2/solve.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
