# .fplan-config.example.yaml — example fplan configuration.
# Copy to .fplan-config.yaml (or run `fplan init`) and edit for your system.
# CLI arguments will override these values where commands support it. There is
# no environment-variable support.
factorio:
  # Data directory (prototype files). Required by commands that load the game
  # model (tech-order, rates, inspect, ...). Example shows a macOS Steam install.
  data_dir: "~/Library/Application Support/Steam/steamapps/common/Factorio/factorio.app/Contents/data"
  # Executable. Required by commands that run Factorio headless (map from-save, ...).
  binary: "~/Library/Application Support/Steam/steamapps/common/Factorio/factorio.app/Contents/MacOS/factorio"
solver:
  # LP method for the SCIP solve (`rates solve`). `fplan init` auto-detects this
  # from the active SCIP's linked LP solver: HiGHS offers a barrier
  # (interior-point) method that handles larger models better; other solvers
  # (e.g. SoPlex) provide simplex only. Omit the section to use SCIP's default;
  # `--lp-algorithm` on `rates solve` overrides it.
  lp_algorithm: barrier  # barrier | simplex
